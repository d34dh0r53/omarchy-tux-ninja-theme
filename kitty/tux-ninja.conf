# Tux Ninja — neon synthwave glow theme for Kitty
# Reference copy of the colors Omarchy generates from colors.toml.
# Do NOT install via `kitten themes` — that creates a stale
# current-theme.conf that overrides Omarchy's generated colors.
# Only the shaders/ directory needs manual setup (see README.md).

foreground           #E8F4F8
background           #101223
selection_foreground #E8F4F8
selection_background #1E5A5A

# Cursor (cyan accent glow)
cursor               #75E7E7
cursor_text_color    #0C0E1C

# URL hints (accent)
url_color            #75E7E7

# The 16 terminal colors
# black
color0               #101223
color8               #7BB0B0

# red
color1               #DD6400
color9               #FFA459

# green
color2               #008484
color10              #18BABA

# yellow
color3               #DDD000
color11              #FFF659

# blue
color4               #18BABA
color12              #75E7E7

# magenta
color5               #7826C7
color13              #B67FEB

# cyan
color6               #4CD8D8
color14              #AAF4F4

# white
color7               #E8F4F8
color15              #E8F4F8

# Neon glow styling
window_border_width  2px
window_padding_width 12

# Subtle glow on the active window border
active_border_color  #75E7E7
inactive_border_color #1E5A5A

# Tabs
active_tab_foreground   #101223
active_tab_background   #4CD8D8
active_tab_font_style   bold
inactive_tab_foreground #7BB0B0
inactive_tab_background #0C0E1C
tab_bar_background      #080913
tab_bar_margin_height   4 0

# Slightly translucent background for that synthwave feel
background_opacity      0.92
background_blur          16

# Neon text/border glow (custom slang shader, kitty >= 0.49).
# Requires shaders/tux-glow.slang + tux-glow.pipeline in kitty's config dir
# (~/.config/kitty/shaders/) — see README.md "Neon glow".
custom_shaders tux-glow

# Font
bold_font              auto
italic_font            auto
bold_italic_font       auto
