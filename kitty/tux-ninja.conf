# Tux Ninja — neon synthwave glow theme for Kitty
# Generated from colors.toml in d34dh0r53/tux-ninja-theme

foreground           #E4E9F8
background           #101223
selection_foreground #E4E9F8
selection_background #2A2E4E

# Cursor (magenta accent glow)
cursor               #BC50A0
cursor_text_color    #0C0E1C

# URL hints (accent)
url_color            #BC50A0

# The 16 terminal colors
# black
color0               #1A1D33
color8               #2A2E4E

# red
color1               #C95D93
color9               #E58CB8

# green
color2               #915582
color10              #B082A6

# yellow
color3               #9182C7
color11              #B4ACDE

# blue
color4               #485D92
color12              #91A0C7

# magenta
color5               #A42F61
color13              #E06FB6

# cyan
color6               #5B2458
color14              #91A0C7

# white
color7               #B9C3DE
color15              #E4E9F8

# Neon glow styling
window_border_width  2px
window_padding_width 12

# Subtle glow on the active window border
active_border_color  #E06FB6
inactive_border_color #2A2E4E

# Tabs
active_tab_foreground   #101223
active_tab_background   #BC50A0
active_tab_font_style   bold
inactive_tab_foreground #6E7597
inactive_tab_background #0C0E1C
tab_bar_background      #080913
tab_bar_margin_height   4 0

# Slightly translucent background for that synthwave feel
background_opacity      0.92
background_blur          16

# Neon text/border glow (custom slang shader, kitty >= 0.49).
# Requires shaders/tux-glow.slang + tux-glow.pipeline in kitty's config dir
# (~/.config/kitty/shaders/) — see README.md "Neon glow".
custom_shaders tux-glow

# Font
bold_font              auto
italic_font            auto
bold_italic_font       auto
