# Tux Ninja — neon glow configuration for Kitty and Ghostty.
#
# One color-agnostic glow: any pixel that is perceptually distinct from the
# background glows in its own color, scaled by how saturated it is. Saturated
# accents (magenta, red, cyan) bloom at full strength while white and pink
# text keep only a faint halo, so nothing blows out.
#
# Edit and re-run:  python3 generate-glow.py
# (strength, white_suppression and chroma_gain can also be tuned directly
# in tux-glow.pipeline — Kitty only — without regenerating; restart the
# terminal after. Ghostty has no pipeline vars: tune the constants in
# tux-glow.glsl, or regenerate.)

[settings]
# Overall glow intensity.
strength = 0.08

# White/pink protection. 0 = every color glows equally; 1 = unsaturated
# (white/gray) pixels never glow. Saturated colors are unaffected.
white_suppression = 0.85

# How quickly a color's saturation earns the full glow. Higher = only the
# most saturated colors reach full strength. White sits near 0, the bluish
# palette mid-tones mid, magenta/red accents at 1.
chroma_gain = 3.2

# Self-brightening of neon text cores (Ghostty only — Kitty's linear
# composite does this implicitly). Gated by saturation³ and neighborhood
# density: solid saturated blocks punch toward blown-out neon while thin
# white text stays crisp. 0 = off, ~4 matches Kitty's look.
text_boost = 4.0
